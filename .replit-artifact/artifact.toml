kind = "web"
previewPath = "/"
title = "Viviane Noronha - Privacy"
version = "1.0.0"
id = "artifacts/viviane-noronha"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22247

[services.development]
run = "pnpm --filter @workspace/viviane-noronha run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/viviane-noronha", "run", "build" ]
publicDir = "artifacts/viviane-noronha/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22247"
BASE_PATH = "/"
